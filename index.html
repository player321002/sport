<!DOCTYPE html>
<html lang="uz" class="scroll-smooth scroll-pt-20">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FitLife — Sog'liq va sport</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: { brand: { 400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' } },
        keyframes: {
          drift: { '0%,100%': { transform: 'translate(0,0) scale(1)' }, '50%': { transform: 'translate(40px,-30px) scale(1.12)' } },
          popin: { from: { opacity: '0', transform: 'translateY(12px) scale(.97)' }, to: { opacity: '1', transform: 'none' } },
          blink: { '50%': { opacity: '0' } },
          pulsering: { '0%': { boxShadow: '0 0 0 0 rgba(34,197,94,.45)' }, '100%': { boxShadow: '0 0 0 16px rgba(34,197,94,0)' } },
          ringin: { from: { opacity: '0', transform: 'scale(.6) rotate(-90deg)' }, to: { opacity: '1', transform: 'none' } }
        },
        animation: {
          drift: 'drift 16s ease-in-out infinite',
          popin: 'popin .6s cubic-bezier(.2,.9,.3,1.2) backwards',
          blink: 'blink 1s steps(1) infinite',
          pulsering: 'pulsering 2.2s ease-out infinite',
          ringin: 'ringin 1s cubic-bezier(.2,.9,.3,1) backwards'
        }
      }
    }
  };
</script>
</head>

<body class="bg-slate-50 font-sans text-slate-900 antialiased overflow-x-hidden dark:bg-slate-950 dark:text-slate-100">

<div id="progress" class="fixed left-0 top-0 z-[60] h-[3px] w-0 bg-gradient-to-r from-brand-500 to-blue-500 print:hidden"></div>

<!-- NAVBAR -->
<header id="navbar" class="sticky top-0 z-40 bg-white/75 pt-[env(safe-area-inset-top,0px)] backdrop-blur transition-shadow duration-300 print:hidden dark:bg-slate-950/75">
  <nav class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-3 px-4">
    <a href="#asosiy" class="flex items-center gap-2 text-lg font-extrabold">
      <span class="grid h-9 w-9 place-items-center rounded-xl bg-brand-500 text-white animate-pulsering">💪</span>FitLife
    </a>
    <div class="hidden items-center gap-5 text-sm font-medium text-slate-600 lg:flex dark:text-slate-300">
      <a href="#panel" data-nav data-i18n="nav_dash" class="transition hover:text-brand-500"></a>
      <a href="#hisoblagich" data-nav data-i18n="nav_calc" class="transition hover:text-brand-500"></a>
      <a href="#vositalar" data-nav data-i18n="nav_tools" class="transition hover:text-brand-500"></a>
      <a href="#jurnal" data-nav data-i18n="nav_journal" class="transition hover:text-brand-500"></a>
      <a href="#mashqlar" data-nav data-i18n="nav_ex" class="transition hover:text-brand-500"></a>
      <a href="#maslahat" data-nav data-i18n="nav_tips" class="transition hover:text-brand-500"></a>
    </div>
    <div class="flex items-center gap-2">
      <span id="greet" class="hidden text-sm text-slate-500 xl:inline dark:text-slate-400"></span>
      <select id="lang" aria-label="Language" class="h-9 rounded-lg border border-slate-300 bg-white px-2 text-sm font-semibold dark:border-slate-700 dark:bg-slate-900">
        <option value="uz">UZ</option>
        <option value="ru">RU</option>
        <option value="en">EN</option>
      </select>
      <button id="themeBtn" type="button" class="h-9 w-9 rounded-lg transition hover:bg-slate-100 dark:hover:bg-slate-800">🌓</button>
      <button id="authBtn" type="button" class="h-9 rounded-lg bg-brand-500 px-4 text-sm font-semibold text-white transition hover:bg-brand-600">Kirish</button>
      <button id="menuBtn" type="button" class="h-9 w-9 rounded-lg hover:bg-slate-100 lg:hidden dark:hover:bg-slate-800" aria-label="Menu">☰</button>
    </div>
  </nav>
  <div id="mobileMenu" class="hidden border-t border-slate-200 px-4 py-3 text-sm font-medium lg:hidden dark:border-slate-800">
    <a href="#panel" data-i18n="nav_dash" class="block py-2"></a>
    <a href="#hisoblagich" data-i18n="nav_calc" class="block py-2"></a>
    <a href="#vositalar" data-i18n="nav_tools" class="block py-2"></a>
    <a href="#jurnal" data-i18n="nav_journal" class="block py-2"></a>
    <a href="#mashqlar" data-i18n="nav_ex" class="block py-2"></a>
    <a href="#maslahat" data-i18n="nav_tips" class="block py-2"></a>
  </div>
</header>

<!-- HERO -->
<section id="asosiy" class="relative overflow-hidden bg-[radial-gradient(60%_50%_at_80%_0%,rgba(34,197,94,.18),transparent_70%),radial-gradient(40%_40%_at_0%_100%,rgba(59,130,246,.12),transparent_70%)]">
  <div class="pointer-events-none absolute -left-16 -top-16 h-72 w-72 animate-drift rounded-full bg-brand-500 opacity-[.35] blur-3xl"></div>
  <div class="pointer-events-none absolute -right-24 top-24 h-96 w-96 animate-drift rounded-full bg-blue-500 opacity-[.35] blur-3xl [animation-delay:-6s]"></div>
  <div class="relative mx-auto grid max-w-6xl items-center gap-12 px-4 py-16 md:grid-cols-2 md:py-24">
    <div class="animate-popin">
      <span data-i18n="hero_badge" class="inline-block rounded-full bg-brand-500/10 px-3 py-1 text-xs font-semibold text-brand-600 dark:text-brand-400"></span>
      <h1 class="mt-5 text-4xl font-extrabold leading-[1.1] tracking-tight md:text-6xl">
        <span data-i18n="hero_h1"></span><br />
        <span id="typed" class="text-brand-500"></span><span class="ml-1 inline-block h-[.9em] w-[3px] animate-blink bg-brand-500 align-[-0.05em]"></span>
      </h1>
      <p data-i18n="hero_sub" class="mt-5 max-w-xl text-lg text-slate-600 dark:text-slate-400"></p>
      <div class="mt-8 flex flex-wrap gap-3">
        <a href="#hisoblagich" data-i18n="hero_cta1" class="rounded-xl bg-brand-500 px-5 py-3 font-semibold text-white transition hover:-translate-y-0.5 hover:bg-brand-600"></a>
        <a href="#mashqlar" data-i18n="hero_cta2" class="rounded-xl border border-slate-300 px-5 py-3 font-semibold transition hover:-translate-y-0.5 hover:bg-white dark:border-slate-700 dark:hover:bg-slate-900"></a>
      </div>
      <dl class="mt-10 grid max-w-md grid-cols-3 gap-4">
        <div><dt data-i18n="stat_ex" class="text-xs text-slate-500"></dt><dd class="text-2xl font-extrabold"><span data-count="11">0</span></dd></div>
        <div><dt data-i18n="stat_lvl" class="text-xs text-slate-500"></dt><dd class="text-2xl font-extrabold"><span data-count="3">0</span></dd></div>
        <div><dt data-i18n="stat_tools" class="text-xs text-slate-500"></dt><dd class="text-2xl font-extrabold"><span data-count="8">0</span></dd></div>
      </dl>
    </div>
    <div class="animate-popin rounded-2xl border border-slate-200 bg-white p-6 shadow-xl shadow-slate-900/5 transition duration-300 hover:-translate-y-1 dark:border-slate-800 dark:bg-slate-900 [animation-delay:.15s]">
      <div class="flex items-center justify-between gap-3">
        <div>
          <p data-i18n="sample" class="text-sm text-slate-500"></p>
          <h3 id="heroName" class="text-xl font-bold"></h3>
        </div>
        <span class="rounded-full bg-brand-500/10 px-3 py-1 text-xs font-semibold text-brand-600 dark:text-brand-400"><span data-i18n="reps"></span>: <b id="heroReps">0</b></span>
      </div>
      <div id="heroFig" class="mt-4 h-64 rounded-2xl bg-slate-100 p-4 dark:bg-slate-800"></div>
      <button id="heroPlay" type="button" data-i18n="watch_full" class="mt-4 w-full rounded-xl bg-slate-900 py-3 font-semibold text-white transition hover:opacity-90 dark:bg-white dark:text-slate-900"></button>
    </div>
  </div>
</section>

<!-- DASHBOARD -->
<section id="panel" class="scroll-mt-20 border-y border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900">
  <div class="mx-auto max-w-6xl px-4 py-14">
    <h2 data-i18n="dash_title" class="text-2xl font-extrabold md:text-3xl"></h2>
    <div class="mt-6 grid grid-cols-2 gap-4 md:grid-cols-4">
      <div class="rounded-2xl bg-slate-50 p-4 dark:bg-slate-950"><p data-i18n="dash_kcal" class="text-xs text-slate-500"></p><p id="dkKcal" class="mt-1 text-2xl font-extrabold">—</p><p id="dkKcalSub" class="text-xs text-slate-500"></p></div>
      <div class="rounded-2xl bg-slate-50 p-4 dark:bg-slate-950"><p data-i18n="dash_eaten" class="text-xs text-slate-500"></p><p id="dkEaten" class="mt-1 text-2xl font-extrabold">0</p><p id="dkEatenSub" class="text-xs text-slate-500"></p></div>
      <div class="rounded-2xl bg-slate-50 p-4 dark:bg-slate-950"><p data-i18n="protein" class="text-xs text-slate-500"></p><p id="dkProt" class="mt-1 text-2xl font-extrabold">0 g</p><p id="dkProtSub" class="text-xs text-slate-500"></p></div>
      <div class="rounded-2xl bg-slate-50 p-4 dark:bg-slate-950"><p data-i18n="dash_water" class="text-xs text-slate-500"></p><p id="dkWater" class="mt-1 text-2xl font-extrabold">0</p><p data-i18n="glasses" class="text-xs text-slate-500"></p></div>
      <div class="rounded-2xl bg-slate-50 p-4 dark:bg-slate-950"><p data-i18n="dash_week" class="text-xs text-slate-500"></p><p id="dkWeek" class="mt-1 text-2xl font-extrabold">0</p><p id="dkWeekSub" class="text-xs text-slate-500"></p></div>
      <div class="rounded-2xl bg-slate-50 p-4 dark:bg-slate-950"><p data-i18n="dash_streak" class="text-xs text-slate-500"></p><p id="dkStreak" class="mt-1 text-2xl font-extrabold">0</p><p data-i18n="dash_days" class="text-xs text-slate-500"></p></div>
      <div class="rounded-2xl bg-slate-50 p-4 dark:bg-slate-950"><p data-i18n="dash_weight" class="text-xs text-slate-500"></p><p id="dkWeight" class="mt-1 text-2xl font-extrabold">—</p><p id="dkWeightSub" class="text-xs text-slate-500"></p></div>
      <div class="rounded-2xl bg-slate-50 p-4 dark:bg-slate-950"><p data-i18n="dash_habits" class="text-xs text-slate-500"></p><p id="dkHabits" class="mt-1 text-2xl font-extrabold">0/0</p><p data-i18n="dash_today" class="text-xs text-slate-500"></p></div>
    </div>
    <div class="mt-6 rounded-2xl border border-brand-500/30 bg-brand-500/10 p-5">
      <p data-i18n="coach_title" class="text-sm font-bold text-brand-700 dark:text-brand-400"></p>
      <p id="coachMsg" class="mt-2 text-sm md:text-base"></p>
    </div>
  </div>
</section>

<!-- CALCULATOR -->
<section id="hisoblagich" class="mx-auto max-w-6xl scroll-mt-20 px-4 py-20">
  <div class="reveal mb-10 opacity-0 translate-y-7 transition duration-700">
    <h2 data-i18n="calc_title" class="text-3xl font-extrabold md:text-4xl"></h2>
    <p data-i18n="calc_sub" class="mt-2 text-slate-600 dark:text-slate-400"></p>
  </div>
  <div class="grid gap-6 lg:grid-cols-5">
    <form id="calcForm" class="reveal space-y-4 rounded-2xl border border-slate-200 bg-white p-6 opacity-0 translate-y-7 transition duration-700 lg:col-span-2 dark:border-slate-800 dark:bg-slate-900">
      <div class="grid grid-cols-2 gap-4">
        <label><span data-i18n="f_age" class="block text-sm font-medium text-slate-600 dark:text-slate-400"></span>
          <input id="age" type="number" value="25" min="14" max="100" class="mt-1.5 w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-slate-900 outline-none focus:ring-2 focus:ring-brand-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100" /></label>
        <label><span data-i18n="f_sex" class="block text-sm font-medium text-slate-600 dark:text-slate-400"></span>
          <select id="sex" class="mt-1.5 w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-slate-900 outline-none focus:ring-2 focus:ring-brand-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100">
            <option value="male" data-i18n="male"></option>
            <option value="female" data-i18n="female"></option>
          </select></label>
        <label><span data-i18n="f_weight" class="block text-sm font-medium text-slate-600 dark:text-slate-400"></span>
          <input id="weight" type="number" value="75" min="30" max="300" class="mt-1.5 w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-slate-900 outline-none focus:ring-2 focus:ring-brand-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100" /></label>
        <label><span data-i18n="f_height" class="block text-sm font-medium text-slate-600 dark:text-slate-400"></span>
          <input id="height" type="number" value="175" min="120" max="230" class="mt-1.5 w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-slate-900 outline-none focus:ring-2 focus:ring-brand-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100" /></label>
      </div>
      <label class="block"><span data-i18n="f_act" class="block text-sm font-medium text-slate-600 dark:text-slate-400"></span>
        <select id="activity" class="mt-1.5 w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-slate-900 outline-none focus:ring-2 focus:ring-brand-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100">
          <option value="1.2" data-i18n="act1"></option>
          <option value="1.375" data-i18n="act2"></option>
          <option value="1.55" selected data-i18n="act3"></option>
          <option value="1.725" data-i18n="act4"></option>
        </select></label>
      <label class="block"><span data-i18n="f_goal" class="block text-sm font-medium text-slate-600 dark:text-slate-400"></span>
        <select id="goal" class="mt-1.5 w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-slate-900 outline-none focus:ring-2 focus:ring-brand-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100">
          <option value="lose" data-i18n="g_lose"></option>
          <option value="keep" data-i18n="g_keep"></option>
          <option value="gain" data-i18n="g_gain"></option>
        </select></label>
      <p id="formError" class="hidden text-sm text-red-500"></p>
      <button type="submit" data-i18n="calc_btn" class="w-full rounded-xl bg-brand-500 py-3 font-semibold text-white transition hover:-translate-y-0.5 hover:bg-brand-600"></button>
    </form>

    <div id="result" class="reveal min-h-[360px] rounded-2xl border border-slate-200 bg-white p-6 opacity-0 translate-y-7 transition duration-700 lg:col-span-3 dark:border-slate-800 dark:bg-slate-900"></div>
  </div>

  <div class="reveal mt-6 rounded-2xl border border-slate-200 bg-white p-6 opacity-0 translate-y-7 transition duration-700 dark:border-slate-800 dark:bg-slate-900">
    <div class="flex items-center justify-between gap-3">
      <h3 data-i18n="hist_title" class="text-lg font-bold"></h3>
      <button id="clearHist" type="button" data-i18n="clear" class="text-sm text-red-500 hover:underline"></button>
    </div>
    <ul id="histList" class="mt-4 grid gap-3 text-sm sm:grid-cols-2 lg:grid-cols-3"></ul>
    <p id="histEmpty" data-i18n="hist_empty" class="mt-2 text-sm text-slate-500"></p>
  </div>
</section>

<!-- TOOLS -->
<section id="vositalar" class="scroll-mt-20 border-y border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900">
  <div class="mx-auto max-w-6xl px-4 py-20">
    <h2 data-i18n="nav_tools" class="mb-8 text-3xl font-extrabold md:text-4xl"></h2>
    <div class="grid gap-6 lg:grid-cols-2">

      <div class="reveal rounded-2xl border border-slate-200 bg-white p-6 opacity-0 translate-y-7 transition duration-700 dark:border-slate-800 dark:bg-slate-950">
        <div class="flex items-center justify-between gap-3">
          <h3 data-i18n="tools_water" class="text-xl font-bold"></h3>
          <span id="waterText" class="text-sm text-slate-500"></span>
        </div>
        <div id="glasses" class="mt-5 grid grid-cols-6 gap-2 sm:grid-cols-8"></div>
        <div class="mt-5 h-3 overflow-hidden rounded-full bg-slate-200 dark:bg-slate-700"><div id="waterBar" class="h-full rounded-full bg-gradient-to-r from-sky-400 to-blue-500 transition-all duration-500"></div></div>
        <div class="mt-5 flex gap-2">
          <button id="waterAdd" type="button" data-i18n="water_add" class="flex-1 rounded-xl bg-sky-500 py-2.5 font-semibold text-white transition hover:bg-sky-600"></button>
          <button id="waterSub" type="button" class="rounded-xl border border-slate-300 px-4 font-semibold dark:border-slate-700">−</button>
          <button id="waterReset" type="button" data-i18n="water_reset" class="rounded-xl border border-slate-300 px-4 font-semibold dark:border-slate-700"></button>
        </div>
        <p class="mt-3 text-xs text-slate-500"><span data-i18n="water_goal"></span>: <span id="waterGoalTxt"></span>. <span data-i18n="water_hint"></span></p>
      </div>

      <div class="reveal rounded-2xl border border-slate-200 bg-white p-6 opacity-0 translate-y-7 transition duration-700 dark:border-slate-800 dark:bg-slate-950">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <h3 data-i18n="tools_timer" class="text-xl font-bold"></h3>
          <div class="flex flex-wrap gap-2">
            <button type="button" class="rounded-full border px-3 py-2 text-xs font-semibold transition hover:-translate-y-px" data-preset="0"></button>
            <button type="button" class="rounded-full border px-3 py-2 text-xs font-semibold transition hover:-translate-y-px" data-preset="30"></button>
            <button type="button" class="rounded-full border px-3 py-2 text-xs font-semibold transition hover:-translate-y-px" data-preset="60"></button>
            <button type="button" class="rounded-full border px-3 py-2 text-xs font-semibold transition hover:-translate-y-px" data-preset="90"></button>
          </div>
        </div>
        <div id="clock" class="mt-6 text-center text-6xl font-extrabold tabular-nums md:text-7xl">00:00</div>
        <div class="mt-6 flex justify-center gap-3">
          <button id="tStart" type="button" class="rounded-xl bg-brand-500 px-8 py-3 font-semibold text-white transition hover:bg-brand-600"></button>
          <button id="tReset" type="button" data-i18n="reset" class="rounded-xl border border-slate-300 px-6 py-3 font-semibold dark:border-slate-700"></button>
        </div>
        <div class="mt-5 flex gap-2">
          <input id="tCustom" type="number" min="5" max="3600" value="45" data-i18n-ph="custom_ph" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-slate-900 outline-none focus:ring-2 focus:ring-brand-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100" />
          <button id="tSet" type="button" data-i18n="set_btn" class="rounded-xl border border-slate-300 px-4 font-semibold dark:border-slate-700"></button>
        </div>
        <p data-i18n="timer_hint" class="mt-4 text-center text-sm text-slate-500"></p>
      </div>

      <div class="reveal rounded-2xl border border-slate-200 bg-white p-6 opacity-0 translate-y-7 transition duration-700 dark:border-slate-800 dark:bg-slate-950">
        <div class="flex items-center justify-between gap-3">
          <h3 data-i18n="tools_habits" class="text-xl font-bold"></h3>
          <span id="habitStat" class="text-sm text-slate-500"></span>
        </div>
        <ul id="habitList" class="mt-4 space-y-2 text-sm"></ul>
        <form id="habitForm" class="mt-4 flex gap-2">
          <input id="habitInput" type="text" maxlength="40" data-i18n-ph="habit_ph" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-slate-900 outline-none focus:ring-2 focus:ring-brand-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100" />
          <button type="submit" data-i18n="add" class="rounded-xl bg-brand-500 px-4 font-semibold text-white transition hover:bg-brand-600"></button>
        </form>
      </div>

      <div class="reveal rounded-2xl border border-slate-200 bg-white p-6 opacity-0 translate-y-7 transition duration-700 dark:border-slate-800 dark:bg-slate-950">
        <h3 data-i18n="tools_1rm" class="text-xl font-bold"></h3>
        <div class="mt-4 grid grid-cols-2 gap-4">
          <label><span data-i18n="rm_w" class="block text-sm font-medium text-slate-600 dark:text-slate-400"></span>
            <input id="rmW" type="number" value="60" min="1" class="mt-1.5 w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-slate-900 outline-none focus:ring-2 focus:ring-brand-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100" /></label>
          <label><span data-i18n="rm_r" class="block text-sm font-medium text-slate-600 dark:text-slate-400"></span>
            <input id="rmR" type="number" value="8" min="1" max="30" class="mt-1.5 w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-slate-900 outline-none focus:ring-2 focus:ring-brand-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100" /></label>
        </div>
        <div id="rmOut" class="mt-5"></div>
      </div>

    </div>
  </div>
</section>

<!-- JOURNAL: nutrition, workouts, weight -->
<section id="jurnal" class="mx-auto max-w-6xl scroll-mt-20 px-4 py-20">

const navL = (navigator.language || 'uz').slice(0, 2);
let lang = store.get('lang') || (I18N[navL] ? navL : 'uz');
if (!I18N[lang]) lang = 'uz';
const t = (k) => I18N[lang][k] ?? I18N.uz[k] ?? k;
function fmt(k, o) { return t(k).replace(/\{(\w+)\}/g, (_, n) => o[n]); }

function applyI18n() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
}

function paths(p) {
  const P = (q) => q[0].toFixed(1) + ' ' + q[1].toFixed(1);
  return {
    spine: `M${P(p[0])} L${P(p[1])} L${P(p[2])}`,
    arm: `M${P(p[1])} L${P(p[3])} L${P(p[4])}`,
    leg: `M${P(p[2])} L${P(p[5])} L${P(p[6])}`,
    leg2: `M${P(p[2])} L${P(p[7])} L${P(p[8])}`
  };
}

function figMarkup(p) {
  const d = paths(p);
  return `<svg viewBox="0 0 300 300" class="h-full w-full text-brand-600 dark:text-brand-400" aria-hidden="true">
    <line x1="20" y1="270" x2="280" y2="270" class="stroke-slate-400 opacity-60 [stroke-linecap:round] [stroke-width:3px]"/>
    <path data-k="leg2" d="${d.leg2}" class="fill-none stroke-current opacity-40 [stroke-linecap:round] [stroke-linejoin:round] [stroke-width:11px]"/>
    <path data-k="leg" d="${d.leg}" class="fill-none stroke-current [stroke-linecap:round] [stroke-linejoin:round] [stroke-width:11px]"/>
    <path data-k="spine" d="${d.spine}" class="fill-none stroke-current [stroke-linecap:round] [stroke-linejoin:round] [stroke-width:11px]"/>
    <path data-k="arm" d="${d.arm}" class="fill-none stroke-current [stroke-linecap:round] [stroke-linejoin:round] [stroke-width:11px]"/>
    <circle data-k="head" cx="${p[0][0]}" cy="${p[0][1]}" r="16" class="fill-current"/>
  </svg>`;
}

class Animator {
  constructor(root, ex, opts = {}) {
    this.ex = ex;
    this.c = 0; this.speed = 1; this.playing = true; this.reps = 0; this.lastStep = -1;
    this.onStep = opts.onStep; this.onRep = opts.onRep; this.onTick = opts.onTick;
    root.innerHTML = figMarkup(ex.anim[0]);
    this.spine = root.querySelector('[data-k=spine]');
    this.arm = root.querySelector('[data-k=arm]');
    this.leg = root.querySelector('[data-k=leg]');
    this.leg2 = root.querySelector('[data-k=leg2]');
    this.head = root.querySelector('[data-k=head]');
  }
  reset() { this.c = 0; this.reps = 0; this.lastStep = -1; if (this.onRep) this.onRep(0); }
  step(dt) {
    if (this.playing) {
      this.c += (dt / LEG_MS) * this.speed;
      if (this.c >= 2) {
        this.c -= 2;
        this.reps++;
        if (this.onRep) this.onRep(this.reps);
      }
    }
    const tt = this.c < 1 ? this.c : 2 - this.c;
    const e = 0.5 - 0.5 * Math.cos(Math.PI * tt);
    const [A, B] = this.ex.anim;
    const p = A.map((q, i) => [q[0] + (B[i][0] - q[0]) * e, q[1] + (B[i][1] - q[1]) * e]);
    this.draw(p);
    const s = (this.c < 0.15 || this.c >= 1.85) ? 0 : (this.c < 1 ? 1 : 2);
    if (s !== this.lastStep) { this.lastStep = s; if (this.onStep) this.onStep(s); }
    if (this.onTick) this.onTick(this.c / 2);
  }
  draw(p) {
    const d = paths(p);
    this.spine.setAttribute('d', d.spine);
    this.arm.setAttribute('d', d.arm);
    this.leg.setAttribute('d', d.leg);
    this.leg2.setAttribute('d', d.leg2);
    this.head.setAttribute('cx', p[0][0].toFixed(1));
    this.head.setAttribute('cy', p[0][1].toFixed(1));
  }
}

let lastTs = null;
function loop(ts) {
  const dt = lastTs === null ? 0 : Math.min(ts - lastTs, 100);
  lastTs = ts;
  active.forEach((a) => a.step(dt));
  requestAnimationFrame(loop);
}

const stat = (label, value) =>
  `<div class="rounded-xl bg-slate-50 p-3 dark:bg-slate-800"><p class="text-xs text-slate-500">${label}</p><p class="mt-0.5 font-bold">${value}</p></div>`;

function countUp(el, to, ms = 1100) {
  if (!el) return;
  const start = performance.now();
  const tick = (now) => {
    const p = Math.min((now - start) / ms, 1);
    el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function calc(e, silent) {
  if (e) e.preventDefault();
  const age = +$('age').value, w = +$('weight').value, h = +$('height').value;
  const sex = $('sex').value, act = +$('activity').value, goal = $('goal').value;
  const err = $('formError');
  if (!(age >= 14 && age <= 100 && w >= 30 && w <= 300 && h >= 120 && h <= 230)) {
    if (!silent) { err.textContent = t('calc_err'); err.classList.remove('hidden'); }
    return;
  }
  err.classList.add('hidden');

  const hm = h / 100;
  const bmr = 10 * w + 6.25 * h - 5 * age + (sex === 'male' ? 5 : -161);
  const tdee = bmr * act;
  const target = Math.round((tdee + GOALS[goal].adj) / 10) * 10;
  const bmi = w / (hm * hm);
  const bmiK = bmi < 18.5 ? 'bmi_low' : bmi < 25 ? 'bmi_norm' : bmi < 30 ? 'bmi_over' : 'bmi_obese';
  const ideal = [Math.round(18.5 * hm * hm), Math.round(24.9 * hm * hm)];

  let perWeek, minutes, kindK;
  if (bmi >= 30) { perWeek = 3; minutes = '20–30'; kindK = 't_obese'; }
  else if (bmi >= 25) { perWeek = 4; minutes = '30–40'; kindK = 't_over'; }
  else if (bmi < 18.5) { perWeek = 3; minutes = '40–60'; kindK = 't_under'; }
  else { perWeek = 4; minutes = '40–60'; kindK = 't_normal'; }
  if (age >= 50) perWeek = Math.min(perWeek, 3);
  const kind = t(kindK) + (age >= 50 ? '. ' + t('t_50') : '');

  const protein = Math.round(w * 1.6);
  const fat = Math.round(target * 0.25 / 9);
  const carbs = Math.max(0, Math.round((target - protein * 4 - fat * 9) / 4));
  const parts = [
    { n: t('protein'), g: protein, kcal: protein * 4, s: 'stroke-brand-500', bg: 'bg-brand-500' },
    { n: t('fat'), g: fat, kcal: fat * 9, s: 'stroke-blue-500', bg: 'bg-blue-500' },
    { n: t('carb'), g: carbs, kcal: carbs * 4, s: 'stroke-amber-500', bg: 'bg-amber-500' }
  ];
  const sum = parts.reduce((s, p) => s + p.kcal, 0) || 1;
  const C = 2 * Math.PI * 44;
  let off = 0;
  const rings = parts.map((p) => {
    const len = C * p.kcal / sum;
    const seg = `<circle cx="50" cy="50" r="44" fill="none" stroke-width="12" class="${p.s}" stroke-dasharray="${len.toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 50 50)"/>`;
    off += len;
    return seg;
  }).join('');
  const legend = parts.map((p) => `
    <li class="flex items-center justify-between gap-3">
      <span class="flex items-center gap-2"><span class="h-2.5 w-2.5 rounded-full ${p.bg}"></span>${p.n}</span>
      <span class="font-semibold">${p.g} g · ${Math.round(p.kcal / sum * 100)}%</span>
    </li>`).join('');

  const days = t('days');
  const kuch = EX.filter((x) => x.cat === 'kuch'), kardio = EX.filter((x) => x.cat === 'kardio');
  const plan = Array.from({ length: perWeek }, (_, i) => {
    const str = i % 2 === 0;
    const pool = str ? kuch : kardio;
    return { day: days[i], focus: str ? t('focus_s') : t('focus_c'), items: [0, 1, 2].map((k) => pool[(i + k) % pool.length]) };
  });

  const stats = [
    stat(t('bmr'), Math.round(bmr) + ' ' + t('kcal')),
    stat(t('tdee'), Math.round(tdee) + ' ' + t('kcal')),
    stat(t('protein'), Math.round(w * 1.6) + '–' + Math.round(w * 2) + ' g'),
    stat(t('bmi'), bmi.toFixed(1) + ' · ' + t(bmiK)),
    stat(t('ideal'), ideal[0] + '–' + ideal[1] + ' kg'),
    stat(t('water_need'), (w * 0.035).toFixed(1) + ' L')
  ].join('');

  lastCalc = { target, goalK: GOALS[goal].k, perWeek, minutes, w };
  save('last', lastCalc);

  $('result').innerHTML = `
  <div class="animate-popin">
    <div class="flex flex-col justify-between gap-6 md:flex-row md:items-center">
      <div>
        <p class="text-sm text-slate-500 dark:text-slate-400">${t('res_kcal')}</p>
        <div class="mt-1 flex items-end gap-2">
          <span id="kcalNum" class="text-6xl font-extrabold tabular-nums text-brand-500">0</span>
          <span class="pb-2 font-semibold text-slate-500">${t('kcal')}</span>
        </div>
        <p class="mt-1 text-sm">${t('res_goal')}: <b>${t(GOALS[goal].k)}</b></p>
      </div>
      <div class="relative mx-auto h-36 w-36 shrink-0">
        <svg viewBox="0 0 100 100" class="h-full w-full origin-center animate-ringin [transform-box:fill-box]">${rings}</svg>
        <div class="absolute inset-0 grid place-items-center text-center text-xs leading-tight text-slate-500">${t('macro')}</div>
      </div>
    </div>
    <ul class="mt-4 space-y-2 text-sm">${legend}</ul>
    <div class="mt-6 grid grid-cols-2 gap-3 sm:grid-cols-3">${stats}</div>

    <div class="mt-6 rounded-2xl border border-brand-500/30 bg-brand-500/10 p-5">
      <h3 class="text-lg font-bold">${t('train_title')}</h3>
      <p class="mt-2 font-semibold">${fmt('per_week', { n: perWeek, m: minutes })}</p>
      <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">${kind}</p>
    </div>

    <h3 class="mt-8 text-lg font-bold">${t('week_plan')}</h3>
    <div class="mt-3 grid gap-3 sm:grid-cols-2">
      ${plan.map((p) => `
        <div class="rounded-xl border border-slate-200 p-4 dark:border-slate-700">
          <p class="text-xs font-semibold text-brand-600 dark:text-brand-400">${p.day} · ${p.focus}</p>
          <ul class="mt-2 space-y-1 text-sm">${p.items.map((x) => `<li>• ${x.name[lang]}</li>`).join('')}</ul>
          <p class="mt-2 text-xs text-slate-500">+ ${t('cooldown')} · ${minutes} ${t('min_s')}</p>
        </div>`).join('')}
    </div>

    <div class="mt-6 flex flex-wrap gap-2">
      <button id="saveBtn" type="button" class="rounded-xl bg-brand-500 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-brand-600">${t('save')}</button>
      <button id="copyBtn" type="button" class="rounded-xl border border-slate-300 px-4 py-2.5 text-sm font-semibold dark:border-slate-700">${t('copy')}</button>
    </div>
    <p class="mt-4 text-xs text-slate-500">${t('calc_note')}</p>
  </div>`;

  countUp($('kcalNum'), target);
  renderWater();
  renderDash();
}

function waterGoal() {

}
function renderWater() {

  $('waterGoalTxt').textContent = `${goal * 250} ml (${goal} ${t('glasses')})`;
}

function addWater(n) {
  const before = water.n;

  saveWater();
  renderWater();

  if (before < waterGoal() && water.n >= waterGoal()) toast(t('water_done'));
}

});

function tmRender() {
  const sec = tm.target ? Math.ceil(tm.ms / 1000) : Math.floor(tm.ms / 1000);
  $('clock').textContent = pad(Math.floor(sec / 60)) + ':' + pad(sec % 60);
}
function tmLabel() { $('tStart').textContent = tm.running ? t('pause') : tm.started ? t('resume') : t('start'); }
function tmStop() { tm.running = false; clearInterval(tm.id); tmLabel(); }
function tmTick() {
  if (tm.target) {
    tm.ms -= 100;
    if (tm.ms <= 0) { tm.ms = 0; tm.started = false; tmStop(); tmRender(); beep(); toast(t('timer_done')); return; }
  } else {
    tm.ms += 100;
  }
  tmRender();
}
function tmToggle() {
  if (tm.running) { tmStop(); return; }
  if (tm.target && tm.ms <= 0) tm.ms = tm.target;
  tm.running = true;
  tm.started = true;
  tm.id = setInterval(tmTick, 100);
  tmLabel();
}
function tmPreset(sec) {
  tmStop();
  tm.target = sec * 1000;
  tm.ms = tm.target;
  tm.started = false;
  tmRender();
  renderTimer();
}
function renderTimer() {
  document.querySelectorAll('[data-preset]').forEach((b) => {
    const s = +b.dataset.preset;
    b.textContent = s ? `${s} ${t('sec_s')}` : t('sw');
    setChip(b, s === tm.target / 1000);

  tmLabel();

function beep() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    const c = new AC();
    [0, 0.45, 0.9].forEach((d) => {
      const o = c.createOscillator(), g = c.createGain();
      o.frequency.value = 880; g.gain.value = 0.15;
      o.connect(g); g.connect(c.destination);
      o.start(c.currentTime + d); o.stop(c.currentTime + d + 0.25);
    });
  } catch (e) {}
}

function chartSVG(pts) {
  const W = 600, H = 220, P = 30;
  const vals = pts.map((p) => p.kg);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = max - min || 1;
  const lo = min - span * 0.15, hi = max + span * 0.15;
  const x = (i) => P + (i * (W - 2 * P)) / (pts.length - 1);
  const y = (v) => H - P - ((v - lo) / (hi - lo)) * (H - 2 * P);
  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.kg).toFixed(1)}`).join(' ');
  const dots = pts.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.kg).toFixed(1)}" r="4" class="fill-brand-500"><title>${p.d}: ${p.kg} kg</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="h-auto w-full text-slate-400" role="img">
    <line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}" class="stroke-current opacity-40"/>
    <polyline points="${line}" class="fill-none stroke-brand-500 [stroke-width:3px]"/>
    ${dots}
    <text x="4" y="${(y(max) + 4).toFixed(1)}" class="fill-current text-[11px]">${max.toFixed(1)}</text>
    <text x="4" y="${(y(min) + 4).toFixed(1)}" class="fill-current text-[11px]">${min.toFixed(1)}</text>
    <text x="${P}" y="${H - 8}" class="fill-current text-[11px]">${pts[0].d.slice(5)}</text>
    <text x="${W - P}" y="${H - 8}" text-anchor="end" class="fill-current text-[11px]">${pts[pts.length - 1].d.slice(5)}</text>
  </svg>`;
}

function streak() {
  const days = new Set(journal.map((e) => e.d));
  Object.keys(habitLog).forEach((d) => { if (Object.values(habitLog[d]).some(Boolean)) days.add(d); });
  let d = today();
  if (!days.has(d)) d = addDays(d, -1);
  let n = 0;
  while (days.has(d)) { n++; d = addDays(d, -1); }
  return n;
}

function coachText() {
  if (!lastCalc) return t('c_calc');
  const e = eatenToday(), target = lastCalc.target, wk = weekEntries().length;
  if (e.kcal > 0 && e.kcal < target * 0.8) return t('c_low');
  if (e.kcal > target * 1.1) return t('c_high');
  if (water.n < waterGoal() / 2) return t('c_water');
  if (wk < 2) return t('c_train');
  const s = streak();
  if (s >= 3) return fmt('c_streak', { n: s });
  return t('c_good');
}

  try {
    Object.keys(localStorage).filter((k) => k.startsWith(KEY)).forEach((k) => { data[k] = localStorage.getItem(k); });
  } catch (e) {}
  const blob = new Blob([JSON.stringify({ app: 'fitlife', version: 2, data }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `fitlife-${today()}.json`;
  document.body.appendChild(a);
  a.click();

$('importFile').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const obj = JSON.parse(await f.text());
    if (obj.app !== 'fitlife' || typeof obj.data !== 'object') throw new Error('bad');
    Object.entries(obj.data).forEach(([k, v]) => {
      if (k.startsWith(KEY) && typeof v === 'string') { try { localStorage.setItem(k, v); } catch (err) {} }
    });
    loadAll();
    renderAll();

    toast(t('imported'));

$('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const email = $('email').value.trim();
  const pass = $('pass').value;
  if (!/^\S+@\S+\.\S+$/.test(email) || pass.length < 4) {
    $('loginErr').textContent = t('auth_err');
    $('loginErr').classList.remove('hidden');
    return;
  }
  user = { name: email.split('@')[0], email };
  save('user', user);
  e.target.reset();
  $('loginErr').classList.add('hidden');
  showModal('authModal', false);
  renderAuth();
  toast(t('welcome'));
});

/* =========================================================
   Keyboard, scroll, reveal, counters, nav highlight, typing
   ========================================================= */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closePlayer(); showModal('authModal', false); return; }
  if (!player || ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
  if (e.key === ' ') { e.preventDefault(); $('pPlay').click(); }
  if (e.key === 'ArrowRight') $('pNext').click();
  if (e.key === 'ArrowLeft') $('pPrev').click();
});

window.addEventListener('scroll', () => {
  const y = window.scrollY;
  const max = document.documentElement.scrollHeight - window.innerHeight;
  $('progress').style.width = (max > 0 ? (y / max) * 100 : 0) + '%';
  $('navbar').classList.toggle('shadow-lg', y > 10);
  const show = y > 600;
  $('toTop').classList.toggle('opacity-0', !show);
  $('toTop').classList.toggle('translate-y-4', !show);
  $('toTop').classList.toggle('pointer-events-none', !show);
}, { passive: true });
$('toTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

const revealIO = new IntersectionObserver((entries) => entries.forEach((en) => {
  if (en.isIntersecting) {
    en.target.classList.remove('opacity-0', 'translate-y-7');
    en.target.classList.add('opacity-100', 'translate-y-0');
    revealIO.unobserve(en.target);
  }
}), { threshold: 0.12 });
document.querySelectorAll('.reveal').forEach((el) => revealIO.observe(el));

const countIO = new IntersectionObserver((entries) => entries.forEach((en) => {
  if (en.isIntersecting) { countUp(en.target, +en.target.dataset.count); countIO.unobserve(en.target); }
}), { threshold: 0.6 });
document.querySelectorAll('[data-count]').forEach((el) => countIO.observe(el));

const navIO = new IntersectionObserver((entries) => entries.forEach((en) => {
  if (!en.isIntersecting) return;
  document.querySelectorAll('[data-nav]').forEach((a) => {
    const on = a.getAttribute('href') === '#' + en.target.id;
    a.classList.toggle('text-brand-600', on);
    a.classList.toggle('dark:text-brand-400', on);
  });
}), { rootMargin: '-45% 0px -50% 0px' });
['panel', 'hisoblagich', 'vositalar', 'jurnal', 'mashqlar', 'maslahat'].forEach((id) => navIO.observe($(id)));

let typeTimer = null, pi = 0, ci = 0, deleting = false;
function startTyping() {
  clearTimeout(typeTimer);
  pi = 0; ci = 0; deleting = false;
  const el = $('typed');
  const tick = () => {
    const words = ['typed_1', 'typed_2', 'typed_3'].map((k) => t(k));
    const word = words[pi];
    if (!deleting) {
      ci++;
      el.textContent = word.slice(0, ci);
      if (ci === word.length) { deleting = true; typeTimer = setTimeout(tick, 1700); }
      else typeTimer = setTimeout(tick, 80);
      return;
    }
    ci--;
    el.textContent = word.slice(0, ci);
    if (ci === 0) { deleting = false; pi = (pi + 1) % 3; typeTimer = setTimeout(tick, 400); }
    else typeTimer = setTimeout(tick, 40);
  };
  tick();
}
